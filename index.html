<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="./script.js" defer></script>
    <link href="./normalize.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="players-info">
        <div id="one" class="player">
            <h3>Player One</h3>
            <p class="score">Score: 0</p>
        </div>
        <div id="two" class="player">
            <h3>Player Two</h3>
            <p class="score">Score: 0</p>
        </div>
    </div>
    <div id="ttt-board">
        <button type="button" id="tile-0"></button>
        <button type="button" id="tile-1"></button>
        <button type="button" id="tile-2"></button>
        <button type="button" id="tile-3"></button>
        <button type="button" id="tile-4"></button>
        <button type="button" id="tile-5"></button>
        <button type="button" id="tile-6"></button>
        <button type="button" id="tile-7"></button>
        <button type="button" id="tile-8"></button>
    </div>
</body>
</html>
